name: RAPID Code Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      scan_path:
        description: 'Directory to scan (default: src/)'
        required: false
        default: 'src/'

# ── Permissions ─────────────────────────────────────────────────────────────
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  rapid-analyze:
    name: RAPID Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Install RAPID CLI ─────────────────────────────────────────────────
      - name: Install RAPID CLI
        run: npm install -g @rapid-dev/cli

      # ── Analyze changed files (on PR) ────────────────────────────────────
      - name: Analyze changed files
        if: github.event_name == 'pull_request'
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_URL: ${{ secrets.RAPID_API_URL || 'https://app.rapid.dev' }}
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx|py|go|sql|tf)$' | head -10 || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No analyzable files changed in this PR."
            exit 0
          fi

          echo "## ⚡ RAPID Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Analyzing changed files..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL_SAVINGS=0
          TOTAL_SUGGESTIONS=0

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              OUTPUT=$(rapid analyze "$file" --output json 2>/dev/null || echo '{"error": "failed"}')

              # Extract savings from JSON
              SAVINGS=$(echo $OUTPUT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.suggestions?.reduce((a,s)=>a+(s.estimatedSaving||0),0)||0)" 2>/dev/null || echo "0")
              SUGGESTIONS=$(echo $OUTPUT | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.suggestions?.length||0)" 2>/dev/null || echo "0")

              TOTAL_SAVINGS=$((TOTAL_SAVINGS + SAVINGS))
              TOTAL_SUGGESTIONS=$((TOTAL_SUGGESTIONS + SUGGESTIONS))

              echo "| \`$file\` | $SUGGESTIONS suggestions | \$$SAVINGS/mo |" >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "$CHANGED_FILES"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $TOTAL_SUGGESTIONS suggestions | \$$TOTAL_SAVINGS/month potential savings**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View full report in RAPID dashboard →](${{ secrets.RAPID_API_URL || 'https://app.rapid.dev' }}/dashboard)" >> $GITHUB_STEP_SUMMARY

      # ── Full workspace scan (on push to main) ─────────────────────────────
      - name: Scan workspace
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_URL: ${{ secrets.RAPID_API_URL || 'https://app.rapid.dev' }}
        run: |
          SCAN_PATH="${{ github.event.inputs.scan_path || 'src/' }}"

          echo "## ⚡ RAPID Workspace Scan" >> $GITHUB_STEP_SUMMARY
          echo "Scanning: \`$SCAN_PATH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          rapid scan "$SCAN_PATH" --output json > rapid-report.json 2>/dev/null || echo '[]' > rapid-report.json

          echo "Scan complete. [View results in dashboard →](${{ secrets.RAPID_API_URL || 'https://app.rapid.dev' }}/dashboard)" >> $GITHUB_STEP_SUMMARY

      # ── Upload report as artifact ────────────────────────────────────────
      - name: Upload RAPID report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapid-analysis-report
          path: rapid-report.json
          retention-days: 30

      # ── Post PR comment ──────────────────────────────────────────────────
      - name: Post analysis comment on PR
        if: github.event_name == 'pull_request' && env.RAPID_API_KEY != ''
        uses: actions/github-script@v7
        env:
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          RAPID_API_URL: ${{ secrets.RAPID_API_URL || 'https://app.rapid.dev' }}
        with:
          script: |
            const fs = require('fs');
            let report = '{}';
            try { report = fs.readFileSync('rapid-report.json', 'utf8'); } catch {}

            const body = `## ⚡ RAPID Analysis

            RAPID analyzed the changed files in this PR.

            | Metric | Value |
            |--------|-------|
            | Files analyzed | ${{ github.event.pull_request.changed_files }} |
            | Status | ✅ Complete |

            [View full suggestions in your RAPID dashboard →](${ process.env.RAPID_API_URL }/dashboard/suggestions)

            <sub>Powered by [RAPID](https://rapid.dev) — Read, Analyze, Patch, Implement & Document</sub>`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes('⚡ RAPID Analysis'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
